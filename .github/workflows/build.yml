name: Flutter Build (APK & IPA)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Java Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Clean
        run: flutter clean

      - name: Get Dependencies
        run: flutter pub get

      - name: iOS Pods
        run: |
          cd ios
          pod install
          cd ..

      # ANDROID
      - name: Build APK
        run: flutter build apk --debug

      # iOS (APP build)
      - name: Build iOS App
        run: flutter build ios --no-codesign

      # 🔥 BURASI KRİTİK: IPA üret
      - name: Create IPA (unsigned)
        run: flutter build ipa --no-codesign

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/ios/ipa/*.ipa
